<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Proxy - harness e proxy intermedi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #fafaf7; color: #000000; font-family: 'Geist', sans-serif; }
    .frame { width: 960px; max-width: 100%; min-width: 0; margin: auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    .heading { font-family: 'Instrument Serif', serif; font-size: 28px; font-weight: 400; }
    .name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; }
    .msg { font-family: 'Geist', sans-serif; font-size: 11px; fill: #000000; }
    .detail { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #666666; }
    .tag, .label { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #666666; letter-spacing: 0.06em; }
    .red { fill: #ff0005; }
    .note { font-family: 'Geist', sans-serif; font-size: 11px; fill: #666666; }
    .halo { paint-order: stroke; stroke: #fafaf7; stroke-width: 5px; stroke-linejoin: round; }
    .box { fill: #fafaf7; stroke: #bfbfbc; stroke-width: 1; }
    .own { fill: #fafaf7; stroke: #ff0005; stroke-width: 2; }
    .private { fill: #fafaf7; stroke: #000000; stroke-width: 1.5; }
    .muted { fill: #f0f0ed; stroke: #bfbfbc; stroke-width: 1; stroke-dasharray: 3,3; }
    .http { fill: none; stroke: #000000; stroke-width: 1.2; marker-end: url(#arrow-link); }
    .local { fill: none; stroke: #666666; stroke-width: 1.2; marker-end: url(#arrow); }
    .async { fill: none; stroke: #666666; stroke-width: 1.2; stroke-dasharray: 5,4; marker-end: url(#arrow); }
    .bad { fill: none; stroke: #ff0005; stroke-width: 1.2; stroke-dasharray: 5,4; marker-end: url(#arrow-red); }
    .life { stroke: #bfbfbc; stroke-width: 1; stroke-dasharray: 2,4; }
    footer { margin-top: 16px; font-size: 11px; color: #666666; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harness-title harness-desc">
        <title id="harness-title">Harness e proxy intermedi verso Copilot</title>
        <desc id="harness-desc">Disposizione consigliata: harness, proxy intermedio, copilot-proxy, Copilot, con la stessa istanza che serve anche VS Code. Ripiego: una seconda istanza di copilot-proxy prima del proxy intermedio, con UPSTREAM_BASE_URL puntato a lui e il developer dichiarato nell'URL.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000000"/></marker>
          <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff0005"/></marker>
        </defs>
        <rect width="960" height="620" fill="#fafaf7"/>
        <text x="40" y="40" class="tag">BIP RED / COPILOT PROXY / HARNESS</text>
        <text x="40" y="80" class="heading">Il proxy di misura va per ultimo, subito prima di Copilot.</text>
        <text x="40" y="132" class="tag">CONSIGLIATA · UN'ISTANZA, ULTIMO ANELLO DELLA CATENA</text>
        <rect x="40" y="148" width="160" height="64" rx="6" class="box"/>
        <text x="56" y="168" class="tag">HARNESS</text>
        <text x="56" y="190" class="name">Claude Code, OpenCode</text>
        <text x="56" y="207" class="detail">Cline, Aider, ...</text>
        <rect x="256" y="148" width="180" height="64" rx="6" class="box"/>
        <text x="272" y="168" class="tag">PROXY INTERMEDIO</text>
        <text x="272" y="190" class="name">copilot-api, LiteLLM</text>
        <text x="272" y="207" class="detail">URL Copilot -&gt; :8787</text>
        <rect x="492" y="148" width="180" height="64" rx="6" class="own"/>
        <text x="508" y="168" class="tag">MISURA · :8787</text>
        <text x="508" y="190" class="name">copilot-proxy</text>
        <text x="508" y="207" class="detail">upstream di default</text>
        <rect x="744" y="148" width="176" height="140" rx="6" class="box"/>
        <text x="760" y="168" class="tag">UPSTREAM</text>
        <text x="760" y="190" class="name">GitHub Copilot</text>
        <text x="760" y="207" class="detail">api.githubcopilot.com</text>
        <rect x="40" y="228" width="160" height="64" rx="6" class="box"/>
        <text x="56" y="248" class="tag">EDITOR</text>
        <text x="56" y="270" class="name">VS Code</text>
        <text x="56" y="287" class="detail">overrideCapiUrl</text>
        <path d="M200 180 H256" class="http"/>
        <path d="M436 180 H492" class="http"/>
        <path d="M672 180 H744" class="http"/>
        <path d="M200 260 H574 Q582 260 582 252 V212" class="http"/>
        <text x="390" y="254" text-anchor="middle" class="label halo">STESSA ISTANZA</text>
        <text x="40" y="340" class="tag">RIPIEGO · IL PROXY INTERMEDIO NON PERMETTE DI CAMBIARE URL</text>
        <rect x="40" y="356" width="160" height="64" rx="6" class="box"/>
        <text x="56" y="376" class="tag">HARNESS</text>
        <text x="56" y="398" class="name">Claude Code, OpenCode</text>
        <text x="56" y="415" class="detail">URL: :8788/u/&lt;developer&gt;</text>
        <rect x="256" y="356" width="180" height="64" rx="6" class="own"/>
        <text x="272" y="376" class="tag">MISURA · :8788</text>
        <text x="272" y="398" class="name">copilot-proxy #2</text>
        <text x="272" y="415" class="detail">upstream: proxy intermedio</text>
        <rect x="492" y="356" width="180" height="64" rx="6" class="box"/>
        <text x="508" y="376" class="tag">PROXY INTERMEDIO</text>
        <text x="508" y="398" class="name">copilot-api, LiteLLM</text>
        <text x="508" y="415" class="detail">login + traduzione</text>
        <rect x="744" y="356" width="176" height="144" rx="6" class="box"/>
        <text x="760" y="376" class="tag">UPSTREAM</text>
        <text x="760" y="398" class="name">GitHub Copilot</text>
        <text x="760" y="415" class="detail">api.githubcopilot.com</text>
        <rect x="40" y="436" width="160" height="64" rx="6" class="box"/>
        <text x="56" y="456" class="tag">EDITOR</text>
        <text x="56" y="478" class="name">VS Code</text>
        <text x="56" y="495" class="detail">overrideCapiUrl</text>
        <rect x="256" y="436" width="180" height="64" rx="6" class="own"/>
        <text x="272" y="456" class="tag">MISURA · :8787</text>
        <text x="272" y="478" class="name">copilot-proxy #1</text>
        <text x="272" y="495" class="detail">avvio automatico</text>
        <path d="M200 388 H256" class="http"/>
        <path d="M436 388 H492" class="http"/>
        <path d="M672 388 H744" class="http"/>
        <path d="M200 468 H256" class="http"/>
        <path d="M436 468 H744" class="http"/>
        <text x="40" y="528" class="note">Nel ripiego l'istanza #2 ha porta (--port) e cartella (COPILOT_PROXY_HOME) proprie e va avviata con start.</text>
        <text x="40" y="546" class="note">Se il proxy intermedio rimappa i modelli, si registra quello in risposta: controlla /_usage/unknown-models.</text>
        <line x1="40" y1="570" x2="920" y2="570" stroke="#bfbfbc"/>
        <line x1="40" y1="594" x2="72" y2="594" stroke="#000000"/>
        <text x="84" y="598" class="note">Richieste</text>
        <rect x="178" y="586" width="16" height="16" rx="2" fill="#fafaf7" stroke="#ff0005" stroke-width="2"/>
        <text x="204" y="598" class="note">Istanza di copilot-proxy</text>
      </svg>
    </div>
    <footer>Palette da bip.red, fondo e grigi adattati per contrasto. PolySans non incluso: Instrument Serif, Geist e Geist Mono sono fallback dichiarati. Diagram Design, doc-inline, statico.</footer>
  </main>
</body>
</html>
