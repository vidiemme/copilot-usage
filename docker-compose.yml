services:
  postgres:
    image: postgres:17-alpine
    container_name: copilot-usage-db
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot_usage
    ports:
      - '5433:5432'
    volumes:
      - copilot-usage-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U copilot -d copilot_usage']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  copilot-usage-data:
